{% extends "base.html" %}
{% block title %}{{ t.thanks_title }} – {{ client.name }}{% endblock %}
{% block content %}
  <div class="card">
    <h1>{{ t.thanks_title }}</h1>
    <p class="muted">{{ client.name }}</p>
    {% if show_google %}
      <p><a class="btn" href="{{ client.google_review_url }}" target="_blank" rel="noopener">{{ t.google_cta }}</a></p>
    {% endif %}
  </div>
{% endblock %}
