<!doctype html>
<html lang="{{ lang|default:'fi' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Palaute{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        --bg0: #0b1020;
        --bg1: #111827;
        --card: rgba(255,255,255,.9);
        --border: rgba(17,24,39,.12);
        --text: #0f172a;
        --muted: #64748b;
        --primary: #111827;
        --primary2: #2563eb;
        --ring: rgba(37,99,235,.28);
        --shadow: 0 18px 50px rgba(2,6,23,.12);
      }
      * { box-sizing: border-box; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(1000px 600px at 10% 0%, rgba(37,99,235,.22), transparent 55%),
          radial-gradient(900px 540px at 90% 10%, rgba(99,102,241,.18), transparent 60%),
          #f7f8fc;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: linear-gradient(180deg, rgba(17,24,39,.95), rgba(17,24,39,.86));
        backdrop-filter: blur(10px);
        color: #fff;
        border-bottom: 1px solid rgba(255,255,255,.08);
      }
      header a { color: #fff; text-decoration: none; }
      header a:hover { text-decoration: underline; }
      .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
      .nav { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
      .nav .links { display: flex; gap: 10px; align-items: center; }
      .brand { font-weight: 650; letter-spacing: .2px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: var(--shadow);
      }
      .muted { color: var(--muted); }
      .grid { display: grid; gap: 12px; }

      input[type="text"], input[type="password"], textarea, select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(15,23,42,.14);
        background: rgba(255,255,255,.95);
        outline: none;
      }
      input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus {
        border-color: rgba(37,99,235,.55);
        box-shadow: 0 0 0 4px var(--ring);
      }
      textarea { resize: vertical; min-height: 96px; }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid rgba(15,23,42,.12);
        background: var(--primary);
        color: #fff;
        cursor: pointer;
        font-weight: 600;
        transition: transform .08s ease, filter .12s ease, background-color .12s ease;
        text-decoration: none;
      }
      .btn:hover { filter: brightness(1.05); }
      .btn:active { transform: translateY(1px); }
      .btn.secondary { background: #fff; color: var(--primary); }
      .btn.accent { background: var(--primary2); border-color: rgba(37,99,235,.35); }

      .msg { padding: 10px 12px; border-radius: 12px; margin: 12px 0; border: 1px solid rgba(15,23,42,.08); }
      .msg.info { background: rgba(224,242,254,.9); }
      .msg.success { background: rgba(220,252,231,.9); }
      .msg.error { background: rgba(254,226,226,.9); }

      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 10px; border-bottom: 1px solid rgba(15,23,42,.10); vertical-align: top; }
      .pagination { display: flex; gap: 8px; align-items: center; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .rating {
        display: inline-flex;
        flex-direction: row-reverse;
        gap: 6px;
        user-select: none;
      }
      .rating input { position: absolute; left: -9999px; }
      .rating label {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        border: 1px solid rgba(15,23,42,.12);
        background: rgba(255,255,255,.9);
        cursor: pointer;
        transition: transform .08s ease, border-color .12s ease, box-shadow .12s ease;
      }
      .rating label::before { content: "★"; font-size: 22px; color: rgba(148,163,184,1); }
      .rating label:hover { transform: translateY(-1px); border-color: rgba(37,99,235,.40); box-shadow: 0 0 0 4px rgba(37,99,235,.12); }
      .rating label:hover::before, .rating label:hover ~ label::before { color: rgba(245,158,11,1); }
      .rating input:checked ~ label::before { color: rgba(245,158,11,1); }
      .rating input:focus-visible + label { box-shadow: 0 0 0 4px var(--ring); border-color: rgba(37,99,235,.55); }

      .stars-display {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        letter-spacing: 1px;
        font-size: 14px;
        white-space: nowrap;
      }
      .stars-display .on { color: rgba(245,158,11,1); }
      .stars-display .off { color: rgba(148,163,184,1); }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap nav">
        <div class="brand"><a href="{% url 'home' %}">Palaute</a></div>
        <div class="links">
          {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button class="btn secondary" type="submit">Kirjaudu ulos</button>
            </form>
          {% else %}
            <a href="{% url 'login' %}">Kirjaudu</a>
          {% endif %}
        </div>
      </div>
    </header>
    <main class="wrap grid">
      {% for message in messages %}
        <div class="msg {{ message.tags|default:'info' }}">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
